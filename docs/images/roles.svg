<svg xmlns="http://www.w3.org/2000/svg" width="1182" height="376" viewBox="0 0 1182 376" role="img" aria-labelledby="title desc">
  <title id="title">Human, AI Agent, and Moraine — roles and interactions</title>
  <desc id="desc">Human: Direct and Accept. AI Agent, such as Claude Code or Codex: Author and Revise. Moraine: Build and Verify. Human sends Requests to AI Agent and receives Responses. AI Agent sends Recipes to Moraine and receives Reports. Human sends Interactions directly to Moraine and receives a 3D View.</desc>
  <defs>
    <style>
      .card { fill: #24323e; stroke: #657582; stroke-width: 1.5; }
      .heading { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size: 28px; font-weight: 700; fill: #f6f8fb; }
      .role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size: 22px; font-weight: 600; fill: #edf3f8; }
      .note { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #c8d2dd; }
      .edge { fill: none; stroke: #8494a4; stroke-width: 2.7; stroke-linecap: round; stroke-linejoin: round; }
      .edge-pill { fill: #354553; stroke: #657582; stroke-width: 1; }
      .edge-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #f5f8fa; }
      .direct-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size: 17px; font-weight: 600; fill: #f5f8fa; }
    </style>
    <marker id="arrow" viewBox="0 0 12 12" refX="9.3" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#8494a4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Transparent canvas and fixed, opaque cards: suitable for both light and dark README themes. -->
  <rect class="card" x="52" y="47" width="292" height="164" rx="15"/>
  <rect class="card" x="445" y="47" width="292" height="164" rx="15"/>
  <rect class="card" x="838" y="47" width="292" height="164" rx="15"/>

  <!-- Restrained, role-specific accents. -->
  <path d="M69 48 H327" stroke="#D97745" stroke-width="3.8" stroke-linecap="round"/>
  <path d="M462 48 H720" stroke="#A78BFA" stroke-width="3.8" stroke-linecap="round"/>
  <path d="M855 48 H1113" stroke="#60A5FA" stroke-width="3.8" stroke-linecap="round"/>

  <!-- Human -->
  <circle cx="91" cy="96" r="18" fill="#D97745" fill-opacity=".12" stroke="#D97745" stroke-width="1.5"/>
  <circle cx="91" cy="90.5" r="5" fill="none" stroke="#D97745" stroke-width="1.9"/>
  <path d="M81 107 Q91 96 101 107" fill="none" stroke="#D97745" stroke-width="1.9" stroke-linecap="round"/>
  <text class="heading" x="121" y="105">Human</text>
  <text class="role" x="77" y="165">Direct &amp; Accept</text>

  <!-- AI Agent -->
  <circle cx="484" cy="96" r="18" fill="#A78BFA" fill-opacity=".12" stroke="#A78BFA" stroke-width="1.5"/>
  <rect x="474" y="89" width="20" height="15" rx="4" fill="none" stroke="#A78BFA" stroke-width="1.8"/>
  <circle cx="480" cy="96.5" r="1.6" fill="#A78BFA"/>
  <circle cx="488" cy="96.5" r="1.6" fill="#A78BFA"/>
  <path d="M484 89 V85" stroke="#A78BFA" stroke-width="1.6" stroke-linecap="round"/>
  <text class="heading" x="514" y="105">AI Agent</text>
  <text class="role" x="470" y="152">Author &amp; Revise</text>
  <text class="note" x="470" y="185">e.g., Claude Code, Codex</text>

  <!-- Moraine -->
  <circle cx="877" cy="96" r="18" fill="#60A5FA" fill-opacity=".12" stroke="#60A5FA" stroke-width="1.5"/>
  <path d="M877 86 L886 91.3 L886 101.1 L877 106.5 L868 101.1 L868 91.3 Z M877 96.3 L877 106.5 M877 96.3 L868 91.3 M877 96.3 L886 91.3" fill="none" stroke="#60A5FA" stroke-width="1.7" stroke-linejoin="round"/>
  <text class="heading" x="907" y="105">Moraine</text>
  <text class="role" x="863" y="165">Build &amp; Verify</text>

  <!-- Human <-> AI Agent -->
  <path class="edge" d="M350 110 H437" marker-end="url(#arrow)"/>
  <path class="edge" d="M437 176 H350" marker-end="url(#arrow)"/>
  <rect class="edge-pill" x="348" y="70" width="94" height="29" rx="8"/>
  <text class="edge-label" x="395" y="89.5" text-anchor="middle">Requests</text>
  <rect class="edge-pill" x="344" y="189" width="102" height="29" rx="8"/>
  <text class="edge-label" x="395" y="208.5" text-anchor="middle">Responses</text>

  <!-- AI Agent <-> Moraine -->
  <path class="edge" d="M743 110 H830" marker-end="url(#arrow)"/>
  <path class="edge" d="M830 176 H743" marker-end="url(#arrow)"/>
  <rect class="edge-pill" x="747" y="70" width="81" height="29" rx="8"/>
  <text class="edge-label" x="787.5" y="89.5" text-anchor="middle">Recipes</text>
  <rect class="edge-pill" x="745" y="189" width="85" height="29" rx="8"/>
  <text class="edge-label" x="787.5" y="208.5" text-anchor="middle">Reports</text>

  <!-- Moraine -> Human: spatial output. -->
  <path class="edge" d="M962 214 V267 H226 V214" marker-end="url(#arrow)"/>
  <rect class="edge-pill" x="522" y="249" width="140" height="36" rx="10"/>
  <text class="direct-label" x="592" y="272.5" text-anchor="middle">3D View</text>

  <!-- Human -> Moraine: spatial interaction. -->
  <path class="edge" d="M164 214 V331 H1018 V214" marker-end="url(#arrow)"/>
  <rect class="edge-pill" x="509" y="313" width="166" height="36" rx="10"/>
  <text class="direct-label" x="592" y="336.5" text-anchor="middle">Interactions</text>
</svg>
